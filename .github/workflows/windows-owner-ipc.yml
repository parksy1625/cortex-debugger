name: M12 Windows owner named pipe

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/owner_pipe_windows.py'
      - 'apps/api/main.py'
      - 'tests/test_windows_owner_ipc.py'
      - 'launchers/start.ps1'
      - '.github/workflows/windows-owner-ipc.yml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'apps/api/owner_pipe_windows.py'
      - 'apps/api/main.py'
      - 'tests/test_windows_owner_ipc.py'
      - '.github/workflows/windows-owner-ipc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-sid:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install only Windows named-pipe and API test packages
        shell: pwsh
        run: |
          python -m pip install -e ".[api]"
          python -m pip install "pytest>=8,<10" "httpx>=0.27,<1"
      - name: Validate real Windows pipe ACL, impersonation, protocol and shutdown
        shell: pwsh
        run: python -m pytest -q tests/test_windows_owner_ipc.py
      - name: Validate explicit Windows SID and named-pipe modules
        shell: pwsh
        run: |
          python -c "import sys,win32pipe,win32security; assert sys.platform == 'win32'"
