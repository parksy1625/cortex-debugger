name: Real-model API and browser E2E

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/cortex-engine/src/cortex_engine/**'
      - 'apps/web/src/**'
      - 'apps/web/tests/live-model.spec.ts'
      - '.github/workflows/real-model-e2e.yml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/cortex-engine/src/cortex_engine/**'
      - 'apps/web/src/**'
      - 'apps/web/tests/live-model.spec.ts'
      - '.github/workflows/real-model-e2e.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CORTEX_DATA_DIR: /tmp/cortex-m5-e2e
      CORTEX_DEV_ORIGIN: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU Torch and Cortex backend
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[ml,api,dev]' -c requirements-linux-py311.lock
      - name: Install browser packages
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Verify Chromium executable
        run: google-chrome --version
      - name: Test actual FastAPI -> GPT-2 and model cache
        env:
          CORTEX_RUN_REAL_MODEL: '1'
        run: pytest -q -m real_model tests/test_live_model_api.py
      - name: Start local API server
        env:
          # Fixed code only for a disposable CI runner, never production.
          CORTEX_PAIRING_CODE: '123456789'
        run: |
          python -m uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 > /tmp/cortex-api.log 2>&1 &
          echo $! > /tmp/cortex-api.pid
          curl --retry 30 --retry-delay 2 --retry-connrefused --fail http://127.0.0.1:8000/api/v1/health
      - name: Drive actual GPT-2 through React and browser
        working-directory: apps/web
        env:
          CORTEX_LIVE_MODEL: '1'
          CORTEX_TEST_PAIRING_CODE: '123456789'
        run: npx playwright test tests/live-model.spec.ts
      - name: Stop local API server
        if: always()
        run: |
          if [ -f /tmp/cortex-api.pid ]; then
            kill "$(cat /tmp/cortex-api.pid)" || true
          fi
      - name: Save failure evidence (may contain token IDs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-live-e2e-failure
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
            /tmp/cortex-api.log
          if-no-files-found: ignore
