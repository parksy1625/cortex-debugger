name: M12 POSIX owner control IPC

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/owner_ipc.py'
      - 'apps/api/main.py'
      - 'tests/test_owner_ipc.py'
      - '.github/workflows/owner-ipc.yml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'apps/api/owner_ipc.py'
      - 'apps/api/main.py'
      - 'tests/test_owner_ipc.py'
      - '.github/workflows/owner-ipc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-uid:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only control-server test dependencies
        run: |
          python -m pip install -e .
          python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'psutil>=6,<9' 'pytest>=8,<10'
      - name: Verify real kernel peer credentials, ownership and socket cleanup
        run: python -m pytest -q tests/test_owner_ipc.py
      - name: Check Linux or Apple Unix-socket peer backend
        run: |
          python -c 'import sys,socket; assert sys.platform in ("linux","darwin"); assert hasattr(socket,"AF_UNIX")'
