name: GPT-2 Cold-Warm Benchmark

on:
  push:
    branches: [main]
    paths:
      - 'scripts/benchmark_model.py'
      - '.github/workflows/benchmark.yml'
      - 'apps/api/model_process.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned backend
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[ml,api]'
      - name: Measure repeated pinned GPT-2 in isolated worker
        run: python -m scripts.benchmark_model --runs 3 --device cpu --output artifacts/m7-benchmark.json
      - name: Upload measured benchmark with runner caveats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-m7-cpu-benchmark
          path: artifacts/m7-benchmark.json
          if-no-files-found: warn
