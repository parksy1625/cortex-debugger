name: Model smoke (manual)

on:
  workflow_dispatch:

jobs:
  gpt2-controls-and-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TransformerLens model extras
        run: pip install -e '.[ml]'
      - name: Identity self-patch (checks numerical parity)
        run: cortex smoke --device cpu --layer 0 --token-index 0
      - name: Clean/corrupted paired-prompt experiment
        run: |
          cortex pair --clean 'The dog runs' --corrupted 'The cat runs' \
            --correct-token ' dog' --incorrect-token ' cat' \
            --layer 5 --token-index 2 --device cpu \
            --output artifacts/model-smoke-pair.json
      - name: Upload the measured report even if earlier steps fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-model-smoke-report
          path: artifacts/model-smoke-pair.json
          if-no-files-found: warn
